name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deployment may be in flight, and queued ones must not be
# cancelled: cancelling mid-deploy can leave the site on a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Reports where the site will live. Requires Pages to be enabled with
      # "GitHub Actions" as its source; enabling it from here would need a token
      # with administration rights, which this workflow deliberately does not have.
      - uses: actions/configure-pages@v6
        id: pages

      - name: Resolve base path
        # A project site lives under /<repo>, a user site at the root. Vite wants
        # exactly one trailing slash in both cases.
        run: echo "BASE_PATH=${BASE%/}/" >> "$GITHUB_ENV"
        env:
          BASE: ${{ steps.pages.outputs.base_path }}

      - name: Build
        run: pnpm build
        env:
          # Optional. Set the repository variable AGENT_API_BASE to a tool proxy
          # origin and every visitor's DuckDuckGo search and page reads go there
          # without touching the Tools panel. Unset, the site stays
          # browser-direct, which is what a fork with no proxy needs. Either way
          # a proxy that fails falls back to calling the provider from the page.
          VITE_AGENT_API_BASE: ${{ vars.AGENT_API_BASE }}

      - name: Add SPA fallback
        # Pages serves 404.html for unknown paths; making it the app shell keeps
        # deep links working before the service worker is installed.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release when the version changed
        env:
          GH_TOKEN: ${{ github.token }}
        # The version in package.json is the release trigger: bump it and merging
        # to main cuts the tag and the release. Unchanged, this is a no-op, so
        # ordinary commits deploy without piling up empty releases.
        run: |
          version="v$(jq -r .version package.json)"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version already released."
            exit 0
          fi
          gh release create "$version" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --generate-notes
