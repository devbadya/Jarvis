<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jarvis — a browser-native AI chat agent. Qwen3.5-0.8B runs on your GPU via WebGPU, with web search and MCP tools."
    />
    <meta name="theme-color" content="#f5f5f5" />
    <title>Jarvis</title>
    <script>
      // Runs before the first paint so the page never flashes the wrong theme.
      // The module bundle is deferred, which is far too late for this.
      // Mirrors applyTheme in src/lib/theme.ts.
      try {
        var stored = localStorage.getItem('jarvis.theme')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#060607' : '#f5f5f5'
      } catch {
        // No stored preference and no matchMedia: the light default already applies.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
